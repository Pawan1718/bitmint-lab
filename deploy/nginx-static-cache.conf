# Bitmint Lab: static asset caching (include inside the HTTPS server block).
# Use only after verifying the active Nginx site config and location precedence.
# Files currently use stable filenames, so keep a short TTL to avoid stale CSS/JS.
location ~* \.(?:css|js)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600, must-revalidate";
    add_header X-Content-Type-Options "nosniff" always;
}
location ~* \.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
}
# HTML stays fresh.
location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-cache";
}
