# Include in the selected Bitmint Lab HTTPS server block after reviewing
# the active Nginx configuration and any existing regex locations.
# Nginx "expires" automatically sets Expires + Cache-Control headers.
# Do not add another Cache-Control header, which causes duplicate values.
# CSS/JS currently use stable filenames; keep TTL short until fingerprinted.
location ~* \\.(?:css|js)$ {
    expires 1h;
    add_header X-Content-Type-Options "nosniff" always;
}
location ~* \\.(?:webp|avif|png|jpe?g|gif|svg|ico|woff2?)$ {
    expires 7d;
    add_header X-Content-Type-Options "nosniff" always;
}
# Don't override existing HTML routing. A short static asset policy
# must not be applied to index.html or to API responses.
